[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlab"
version = "0.2.0"
description = "A measurement theory of trust in AI-driven software testing: when AI-generated, AI-healed, and AI-adjudicated test verdicts can be believed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = [
    "trustlab",
    "trustlab.sut",
    "trustlab.modalities",
    "trustlab.trust",
    "trustlab.metrics",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
